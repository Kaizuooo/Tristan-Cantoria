<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Goal 5</title>
<style>

  body {
    margin: 0;
    padding: 40px;
    background: #fff;
    font-family: Georgia, 'Times New Roman', serif;
  }

  .stage {
    position: relative;
    width: 540px;
    height: 800px;
  }

  .box {
    position: absolute;
  }
  .green {
    left: 0;
    top: 0;
    width: 290px;
    height: 285px;
    border: 20px solid #000;
    padding: 20px;
    background: #4f9b94;
    color: #111;
    font-size: 15px;
    line-height: 1.4;
    border-width: 10px;
  }
  .yellow {
    left: 290px;
    top: 285px;
    width: 245px;
    height: 265px;
    border-width: 20px 10px;
    border-style: solid;
    border-color: #000;
    background: #ffd400;
  }
  .red {
    left: 45px;
    top: 550px;
    width: 245px;
    height: 245px;
    background: #cc6363;
    border-style: solid;
    border-width: 10px;
  }
</style>
</head>
<body>

  <div class="stage">
    <div class="box green">
      Lorem ipsum dolor sit amet, consectetur adipiscing elit. Aliquam at sapien porttitor
      urna elementum lacinia. In id magna pulvinar, ultricies lorem id, vehicula elit.
      Aliquam eu luctus nisl, vitae pellentesque magna. Phasellus dolor metus, laoreet ac
      convallis sit amet, efficitur sed dolor.
    </div>

    <div class="box yellow"></div>

    <div class="box red"></div>
  </div>

</body>
</html>
