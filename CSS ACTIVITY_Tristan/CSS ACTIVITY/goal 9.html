<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Goal 9</title>
<style>
  body {
    font: normal;
    margin: 0;
  }

  h1 {
    font-size: 30px;
    margin-bottom: 20px;
  }

  p {
    display: inline-block;
    width: 180px;
    height: 180px;
    margin: 0;
    padding: 5px;
    color: white;
    font-size: 14px;
    box-sizing: border-box;
    margin-left: 5px;
    
  }

  .red {
    background-color: red;
  }

  .green {
    background-color: green;
  }

  .blue {
    background-color: blue;
  }
</style>
</head>
<body>

<h1>CSS Display Property</h1>

<p class="red">Red Paragraph</p><p class="green">Green Paragraph</p><p class="blue">Blue Paragraph</p>

</body>
</html>
